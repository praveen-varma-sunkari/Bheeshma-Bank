    <title>Bheeshma Bank - Autonomous Banking & Multi-Agent Engine</title>
    <meta name="description" content="Bheeshma Bank - Next-generation advanced international banking platform powered by multi-agent AI for instant global settlements, biometric KYC underwriting, and autonomous wealth management." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:red;z-index:99999;padding:20px;font-family:sans-serif;overflow:auto;"><h3>App Crashed</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:red;z-index:99999;padding:20px;font-family:sans-serif;overflow:auto;"><h3>Unhandled Promise Rejection</h3><p>' + e.reason + '</p></div>';
      });
    </script>
  </body>
